</style><header><span class="logo">🏪</span><strong>小小商店老闆</strong><button class="right" id="help">ⓘ　玩法說明</button></header><main><small>理財小鎮　›　商店經營</small><div class="top"><h1>我的商店</h1><span class="day right" id="day"></span></div><div class="layout"><section class="scene" aria-label="小鎮商店插畫"><i class="cloud"></i><i class="cloud" style="left:78%;top:38px"></i><i class="hill"></i><i class="hill b"></i><i class="ground"></i><span class="tree">🌳</span><div class="stall"><div class="sign" id="sign"></div><div class="awning"></div><div class="window" id="goods"></div><div class="counter"></div><div class="front">✦　❀　✦</div></div><span class="tree pot">🪴</span><label>☀️　小鎮商店街</label></section><aside class="card"><h2>👛　我的小金庫</h2><div class="stats"><div><small>可用資金</small><b id="cash"></b></div><div><small>已存利潤</small><b id="bank"></b></div></div><div class="mission"><h3>🔎　超市偵探</h3><p>用 100 元買齊三項必需品和一項想要的物品。</p><button id="quest">挑戰任務　→</button></div></aside></div><section class="card plan"><div class="row"><h2>🧾　今日營業計畫</h2><select class="right" id="shop" aria-label="選擇商店"><option>飲料店</option><option>文具店</option><option>農場</option></select></div><p id="info" class="note"></p><div class="controls"><label class="control">📦　進貨數量　<b id="qty"></b><input id="q" type="range" min="1" max="30" value="10"></label><label class="control">🏷️　每件售價　<b id="price"></b><input id="p" type="range" min="1" max="50" value="20"></label></div><div class="foot"><span class="money" id="cost"></span><button class="go" id="sell">開始營業　→</button></div></section></main><dialog id="modal"><div id="body"></div><button id="close">返回商店</button></dialog><script src="game.js"></script></html>
